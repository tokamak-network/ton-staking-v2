# RAT Client E2E Test Environment
# 전체 Optimism 스택 + RAT Contract
version: '3.8'

services:
  # L1 Ethereum (geth)
  l1:
    image: ethereum/client-go:latest
    ports:
      - "8545:8545"
      - "8546:8546"
    command:
      - --dev
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3,debug,admin
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.api=eth,net,web3,debug,admin
    volumes:
      - l1_data:/data

  # L2 Optimism geth
  l2:
    build:
      context: ../../lib/optimism/op-geth
    depends_on:
      - l1
    ports:
      - "9545:8545"
      - "9546:8546"
    environment:
      - L1_RPC=http://l1:8545
    volumes:
      - l2_data:/data

  # op-node (Rollup Node)
  op-node:
    build:
      context: ../../lib/optimism
      dockerfile: op-node/Dockerfile
    depends_on:
      - l1
      - l2
    ports:
      - "9545:9545"  # Rollup RPC
    command:
      - op-node
      - --l1=http://l1:8545
      - --l2=http://l2:8545
      - --rpc.addr=0.0.0.0
      - --rpc.port=9545
      - --rollup.config=/rollup.json
    volumes:
      - ./rollup.json:/rollup.json

  # op-batcher
  op-batcher:
    build:
      context: ../../lib/optimism
      dockerfile: op-batcher/Dockerfile
    depends_on:
      - l1
      - l2
      - op-node
    command:
      - op-batcher
      - --l1-eth-rpc=http://l1:8545
      - --l2-eth-rpc=http://l2:8545
      - --rollup-rpc=http://op-node:9545

  # RAT Contract Deployer (one-time job)
  rat-deployer:
    build:
      context: ../..
      dockerfile: Dockerfile.deployer
    depends_on:
      - l1
    environment:
      - L1_RPC=http://l1:8545
    volumes:
      - ./deployments:/deployments

volumes:
  l1_data:
  l2_data:
