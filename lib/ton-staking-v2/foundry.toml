[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
via_ir = false   # Stack too deep 에러로 인해 필수
optimizer = true
optimizer_runs = 100
solc_version = "0.8.19"
build_info = true
extra_output = ["evm.bytecode", "evm.deployedBytecode", "metadata"]

[profile.production]
via_ir = true
optimizer = true
optimizer_runs = 200
solc_version = "0.8.19"
build_info = true
extra_output = ["evm.bytecode", "evm.deployedBytecode", "metadata"]

remappings = [
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
  'forge-std/=lib/forge-std/src/',
  'ds-test/=lib/openzeppelin-contracts/lib/forge-std/lib/ds-test/src/',
]

[profile.default.fuzz]
runs = 256

ffi = true

[lint]
exclude_lints = [
    "mixed-case-function",
    "mixed-case-variable",
    "unaliased-plain-import",
    "pascal-case-struct",
    "unwrapped-modifier-logic",
    "screaming-snake-case-const",
    "unused-import",
    "unsafe-typecast",
    "asm-keccak256",
    "erc20-unchecked-transfer",
    "unsafe-cheatcode",
    "incorrect-shift"
]

# Allow script to read/write deployment files
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read-write", path = ".devnet/" },
]
