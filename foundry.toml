[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
cache_path = "cache"

# Compiler settings
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Testing
verbosity = 2
ffi = false
fs_permissions = [{ access = "read", path = "./"}]

# Formatter
fmt.line_length = 120
fmt.tab_width = 4
fmt.bracket_spacing = false
fmt.int_types = "long"
fmt.multiline_func_header = "all"
fmt.quote_style = "double"
fmt.number_underscore = "thousands"
fmt.single_line_statement_blocks = "preserve"
fmt.wrap_comments = true

[profile.ci]
verbosity = 4
fuzz.runs = 10000

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
local = "http://127.0.0.1:8545"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
