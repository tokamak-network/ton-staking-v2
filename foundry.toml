[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
via_ir = true
optimizer = true
optimizer_runs = 100  # 200에서 100으로 줄여서 컴파일 속도 개선
solc_version = "0.8.19"
# Help with artifact mapping for --via-ir
build_info = true
extra_output = ["evm.bytecode", "evm.deployedBytecode", "metadata"]

[profile.production]
via_ir = true
optimizer = true
optimizer_runs = 200
solc_version = "0.8.19"

remappings = [
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
  '@openzeppelin/contracts-upgradeable/=lib/optimism/packages/contracts-bedrock/lib/openzeppelin-contracts-upgradeable/contracts/',
  '@optimism/=lib/optimism/packages/contracts-bedrock/',
  '@optimism-bedrock/=lib/optimism/packages/contracts-bedrock/src/',
  'interfaces/=lib/optimism/packages/contracts-bedrock/interfaces/',
  '@optimism-src/=lib/optimism/packages/contracts-bedrock/src/',
  '@rari-capital/solmate/=lib/optimism/packages/contracts-bedrock/lib/solmate/',
  '@solady/=lib/optimism/packages/contracts-bedrock/lib/solady/src/',
  'safe-contracts/=lib/optimism/packages/contracts-bedrock/lib/safe-contracts/contracts/',
  'forge-std/=lib/forge-std/src/',
  'ds-test/=lib/openzeppelin-contracts/lib/forge-std/lib/ds-test/src/',
  '@tokamak-dao/=lib/tokamak-dao-contracts/contracts/',
]

[profile.default.fuzz]
runs = 256

# Allow script to write deployment files
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = ".devnet" },
    { access = "read-write", path = "./" },
    { access = "read", path = "/Users/harvey/Desktop/onther/event/migration/ton-staking-v2/abis" }
]
