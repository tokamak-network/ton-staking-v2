[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
via_ir = false   # RAT 컨트랙트 크기 최적화 (24KB 제한)
optimizer = true
optimizer_runs = 100
solc_version = "0.8.19"
build_info = true
extra_output = ["evm.bytecode", "evm.deployedBytecode", "metadata"]
ignored_warnings_from = ["test/"]
ignored_error_codes = [2018, 5574, 5667]

[profile.production]
via_ir = true
optimizer = true
optimizer_runs = 200
solc_version = "0.8.19"
build_info = true
extra_output = ["evm.bytecode", "evm.deployedBytecode", "metadata"]


remappings = [
  '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
  'forge-std/=lib/forge-std/src/',
  'ds-test/=lib/openzeppelin-contracts/lib/forge-std/lib/ds-test/src/',
]

[profile.default.fuzz]
runs = 256

ffi = true

[lint]
lint_on_build = false

# Allow script to read/write deployment files
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read-write", path = ".devnet/" },
]
