[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./.env" }]
ignored_error_codes = [5574]

[profile.test]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
via_ir = false
optimizer = false
fs_permissions = [{ access = "read", path = "./.env" }]
ignored_error_codes = [5574]


[rpc_endpoints]
mainnet = "${ETH_NODE_URI_MAINNET}"